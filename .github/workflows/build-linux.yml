name: Build NxATerm (Linux)

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ci-builds]

env:
  # Pilha GTK 3 + WebKitGTK 4.1: a mais ampla (Ubuntu 22.04+, Debian 12+, Fedora, openSUSE, Arch).
  GOFLAGS: -tags=gtk3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04     # Ubuntu 22.04 é a base mais antiga com WebKitGTK 4.1; o executável roda também nas mais novas.
            arch: amd64
            march: x86_64
            required: true
          - runner: ubuntu-22.04-arm
            arch: arm64
            march: aarch64
            required: false
    runs-on: ${{ matrix.runner }}
    # o ARM64 é extra: um problema nele não impede a publicação do restante
    continue-on-error: ${{ !matrix.required }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - uses: ./.github/actions/preparar

      - name: Testes
        working-directory: app/nxaterm
        run: go test ./internal/...

      - name: Compilar
        working-directory: app/nxaterm
        run: |
          wails3 build EXTRA_TAGS=gtk3
          ls -l bin
          file bin/nxaterm
          ldd bin/nxaterm | grep -E 'gtk|webkit|javascriptcore' || true
          if ldd bin/nxaterm | grep 'not found'; then exit 1; fi

      - name: Análise e testes do pacote principal (não bloqueiam)
        working-directory: app/nxaterm
        run: |
          set +e
          { go vet . && go test . ; } > /tmp/analise.log 2>&1
          code=$?
          msg="$(tail -n 20 /tmp/analise.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          if [ "$code" = 0 ]; then echo "::notice title=go vet e go test::OK%0A$msg"; else echo "::warning title=go vet e go test::falhou ($code)%0A$msg"; fi
          exit 0

      - name: Preparar os arquivos de empacotamento
        working-directory: app/nxaterm
        run: |
          mkdir -p pkg dist
          cp "$GITHUB_WORKSPACE"/packaging/linux/* pkg/
          cp build/appicon.png pkg/nxaterm.png
          desktop-file-validate pkg/nxaterm.desktop

      - name: Pacotes .deb, .rpm e Arch
        working-directory: app/nxaterm
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          export VERSION="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")"
          for fmt in deb rpm archlinux; do
            wails3 tool package -name nxaterm -format "$fmt" -config ./pkg/nfpm.yaml -out dist
          done
          ls -l dist

      - name: Arquivo .tar.gz com instalador
        working-directory: app/nxaterm
        run: |
          VERSION="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")"
          T="nxaterm-$VERSION-linux-${{ matrix.march }}"
          mkdir -p "tar/$T"
          cp bin/nxaterm pkg/nxaterm.png pkg/nxaterm.desktop pkg/install.sh pkg/deps-check.sh "tar/$T/"
          tar -C tar -czf "dist/$T.tar.gz" "$T"

      - name: AppImage
        working-directory: app/nxaterm
        run: |
          VERSION="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")"
          A=AppDir
          mkdir -p "$A/usr/bin" "$A/usr/share/nxaterm"
          cp bin/nxaterm "$A/usr/bin/nxaterm"
          cp pkg/deps-check.sh "$A/usr/share/nxaterm/"
          cp pkg/AppRun "$A/AppRun"
          cp pkg/nxaterm.desktop pkg/nxaterm.png "$A/"
          ln -s nxaterm.png "$A/.DirIcon"
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.march }}.AppImage
          sha256sum appimagetool
          chmod +x appimagetool
          ARCH=${{ matrix.march }} APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --no-appstream "$A" "dist/NxATerm-$VERSION-${{ matrix.march }}.AppImage"
          ls -l dist

      - name: Conferir o conteúdo dos pacotes
        working-directory: app/nxaterm
        run: |
          dpkg -I dist/*.deb
          dpkg -c dist/*.deb
          tar -tzf dist/*.tar.gz
          (cd dist && sha256sum * | tee SHA256SUMS)

      - name: Teste de instalação e abertura (não bloqueia)
        working-directory: app/nxaterm
        run: |
          set +e
          sudo apt-get install -y ./dist/*.deb > /tmp/apt.log 2>&1 || { tail -n 20 /tmp/apt.log; }
          # Abre a janela num monitor virtual por alguns segundos: se o processo cair antes, é falha.
          export WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1
          xvfb-run -a dbus-run-session -- timeout 10 nxaterm > /tmp/abrir.log 2>&1
          code=$?
          msg="$(tail -n 25 /tmp/abrir.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          if [ "$code" = 124 ]; then echo "::notice title=Abertura::continuou aberto até o tempo acabar%0A$msg"; else echo "::warning title=Abertura::saiu com código $code%0A$msg"; fi
          exit 0

      - name: Publicar os pacotes
        uses: actions/upload-artifact@v4
        with:
          name: nxaterm-linux-${{ matrix.arch }}
          path: |
            app/nxaterm/dist/*
          if-no-files-found: error
