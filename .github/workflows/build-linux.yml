name: Build NxATerm (Linux)

on:
  workflow_dispatch:
  workflow_call:

env:
  # Pilha GTK 3 + WebKitGTK 4.1: a mais ampla (Ubuntu 22.04+, Debian 12+, Fedora, openSUSE, Arch).
  GOFLAGS: -tags=gtk3

jobs:
  build:
    # Ubuntu 22.04 é a base mais antiga com WebKitGTK 4.1; o executável roda também nas mais novas.
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar as bibliotecas de compilação
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus-x11 desktop-file-utils

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'

      - name: Instalar o CLI do Wails v3
        run: |
          go version
          node --version
          go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Criar o projeto base (wails3 init)
        run: |
          wails3 version
          wails3 init -n nxaterm -t vanilla -mod nxaterm -d app -q -s

      - name: Aplicar os arquivos do NxATerm por cima do projeto base
        run: |
          cp -r overlay/. app/nxaterm/
          rm -f app/nxaterm/greetservice.go app/nxaterm/frontend/src/main.ts
          base64 -d app/nxaterm/icon/appicon.png.b64 > app/nxaterm/build/appicon.png
          rm -rf app/nxaterm/icon
          file app/nxaterm/build/appicon.png

      - name: Dependências Go (versões fixas)
        working-directory: app/nxaterm
        run: |
          go get golang.org/x/crypto@v0.58.0 golang.org/x/sys@v0.49.0 github.com/pkg/sftp@v1.13.12 go.bug.st/serial@v1.8.0 github.com/aymanbagabas/go-pty@v0.2.3
          go mod tidy
          go mod verify

      - name: Dependências do frontend (versões fixas)
        working-directory: app/nxaterm/frontend
        run: |
          npm install
          npm install --save-exact @xterm/xterm@6.0.0 @xterm/addon-fit@0.11.0 @xterm/addon-search@0.16.0 @xterm/addon-web-links@0.12.0 @wailsio/runtime@3.0.0
          npm install -D --save-exact vite@8.3.5
          npm ls --depth=0
          npm audit signatures
          npm pkg set 'scripts.build=vite build'
          npm pkg set 'scripts.build:dev=vite build'

      - name: Gerar os bindings Go para JS
        working-directory: app/nxaterm
        run: wails3 generate bindings

      - name: Testes
        working-directory: app/nxaterm
        run: go test ./internal/...

      - name: Compilar
        working-directory: app/nxaterm
        run: |
          wails3 build EXTRA_TAGS=gtk3
          ls -l bin
          file bin/nxaterm
          ldd bin/nxaterm | grep -E 'gtk|webkit|javascriptcore' || true
          if ldd bin/nxaterm | grep 'not found'; then exit 1; fi

      - name: Análise e testes do pacote principal (não bloqueiam)
        working-directory: app/nxaterm
        run: |
          set +e
          { go vet . && go test . ; } > /tmp/analise.log 2>&1
          code=$?
          msg="$(tail -n 20 /tmp/analise.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          if [ "$code" = 0 ]; then echo "::notice title=go vet e go test::OK%0A$msg"; else echo "::warning title=go vet e go test::falhou ($code)%0A$msg"; fi
          exit 0

      - name: Preparar os arquivos de empacotamento
        working-directory: app/nxaterm
        run: |
          mkdir -p pkg dist
          cp "$GITHUB_WORKSPACE"/packaging/linux/* pkg/
          cp build/appicon.png pkg/nxaterm.png
          desktop-file-validate pkg/nxaterm.desktop

      - name: Pacotes .deb, .rpm e Arch
        working-directory: app/nxaterm
        env:
          GOARCH: amd64
        run: |
          export VERSION="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")"
          for fmt in deb rpm archlinux; do
            wails3 tool package -name nxaterm -format "$fmt" -config ./pkg/nfpm.yaml -out dist
          done
          ls -l dist

      - name: Arquivo .tar.gz com instalador
        working-directory: app/nxaterm
        run: |
          VERSION="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")"
          T="nxaterm-$VERSION-linux-x86_64"
          mkdir -p "tar/$T"
          cp bin/nxaterm pkg/nxaterm.png pkg/nxaterm.desktop pkg/install.sh pkg/deps-check.sh "tar/$T/"
          tar -C tar -czf "dist/$T.tar.gz" "$T"

      - name: AppImage
        working-directory: app/nxaterm
        run: |
          VERSION="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")"
          A=AppDir
          mkdir -p "$A/usr/bin" "$A/usr/share/nxaterm"
          cp bin/nxaterm "$A/usr/bin/nxaterm"
          cp pkg/deps-check.sh "$A/usr/share/nxaterm/"
          cp pkg/AppRun "$A/AppRun"
          cp pkg/nxaterm.desktop pkg/nxaterm.png "$A/"
          ln -s nxaterm.png "$A/.DirIcon"
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          sha256sum appimagetool
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --no-appstream "$A" "dist/NxATerm-$VERSION-x86_64.AppImage"
          ls -l dist

      - name: Conferir o conteúdo dos pacotes
        working-directory: app/nxaterm
        run: |
          dpkg -I dist/*.deb
          dpkg -c dist/*.deb
          tar -tzf dist/*.tar.gz
          (cd dist && sha256sum * | tee SHA256SUMS)

      - name: Teste de instalação e abertura (não bloqueia)
        working-directory: app/nxaterm
        run: |
          set +e
          sudo apt-get install -y ./dist/*.deb > /tmp/apt.log 2>&1 || { tail -n 20 /tmp/apt.log; }
          # Abre a janela num monitor virtual por alguns segundos: se o processo cair antes, é falha.
          export WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1
          xvfb-run -a dbus-run-session -- timeout 10 nxaterm > /tmp/abrir.log 2>&1
          code=$?
          msg="$(tail -n 25 /tmp/abrir.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          if [ "$code" = 124 ]; then echo "::notice title=Abertura::continuou aberto até o tempo acabar%0A$msg"; else echo "::warning title=Abertura::saiu com código $code%0A$msg"; fi
          exit 0

      - name: Publicar os pacotes
        uses: actions/upload-artifact@v4
        with:
          name: nxaterm-linux
          path: |
            app/nxaterm/dist/*
          if-no-files-found: error
