name: Publicar versão

on:
  workflow_dispatch:

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml

  linux:
    uses: ./.github/workflows/build-linux.yml

  macos:
    uses: ./.github/workflows/build-macos.yml

  publicar:
    needs: [windows, linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Baixar os arquivos compilados
        uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Reunir os arquivos da versão
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p versao
          find artefatos -type f | sort

          # copia só se o arquivo existir (ARM64 e macOS são opcionais)
          pegar() { if [ -f "$1" ]; then cp "$1" "versao/$2"; echo "incluído: $2"; else echo "ausente (ignorado): $2"; fi; }

          # Windows: amd64 é obrigatório
          for a in amd64 arm64; do
            pegar "artefatos/nxaterm-windows-installer-$a/nxaterm-$a-installer.exe" "NxATerm-$VERSION-windows-$a-setup.exe"
            pegar "artefatos/nxaterm-windows-$a/nxaterm.exe" "NxATerm-$VERSION-windows-$a-portatil.exe"
          done

          # Linux
          for par in amd64:x86_64 arm64:aarch64; do
            a="${par%%:*}"; m="${par##*:}"
            L="artefatos/nxaterm-linux-$a"
            pegar "$L/nxaterm.deb" "nxaterm_${VERSION}_$a.deb"
            pegar "$L/nxaterm.rpm" "nxaterm-${VERSION}-1.$m.rpm"
            pegar "$L/nxaterm.pkg.tar.zst" "nxaterm-${VERSION}-1-$m.pkg.tar.zst"
            pegar "$L/NxATerm-$VERSION-$m.AppImage" "NxATerm-$VERSION-$m.AppImage"
            pegar "$L/nxaterm-$VERSION-linux-$m.tar.gz" "nxaterm-$VERSION-linux-$m.tar.gz"
          done

          # macOS
          for l in arm64 x86_64; do
            pegar "artefatos/nxaterm-macos-$l/NxATerm-$VERSION-macos-$l.zip" "NxATerm-$VERSION-macos-$l.zip"
          done

          # o conjunto mínimo precisa existir
          for f in "NxATerm-$VERSION-windows-amd64-setup.exe" "NxATerm-$VERSION-x86_64.AppImage" "nxaterm_${VERSION}_amd64.deb"; do
            [ -f "versao/$f" ] || { echo "::error::faltou $f"; exit 1; }
          done
          (cd versao && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          cat > notas.md <<NOTAS
          ## NxATerm $VERSION

          Gerenciador de sessões SSH, SFTP, FTP, Telnet, Serial, shell local, RDP, VNC, Spice e Web, com MultiExec, túneis, macros, sincronização, assistente de IA e interface em português, inglês e espanhol.

          **Windows 10/11** (x64 e ARM64): baixe \`NxATerm-$VERSION-windows-amd64-setup.exe\` (ou \`-arm64-\`) e execute. Instala só para o seu usuário. Há também a versão portátil.

          **Linux** (x86_64 e aarch64; precisa do WebKitGTK 4.1: Ubuntu 22.04+, Debian 12+, Fedora, openSUSE, Arch):
          - Debian / Ubuntu / Mint: \`sudo apt install ./nxaterm_${VERSION}_amd64.deb\`
          - Fedora / openSUSE / RHEL: \`sudo dnf install ./nxaterm-${VERSION}-1.x86_64.rpm\`
          - Arch / Manjaro: \`sudo pacman -U nxaterm-${VERSION}-1-x86_64.pkg.tar.zst\`
          - Qualquer distro: AppImage (\`chmod +x\` e execute) ou o \`.tar.gz\` com \`install.sh\`

          **macOS** (Apple Silicon e Intel): baixe o \`.zip\` da sua arquitetura, descompacte e arraste o NxATerm para Aplicativos. O app não é assinado nem notarizado pela Apple: na primeira vez, clique com o botão direito e escolha Abrir, ou execute \`xattr -cr /Applications/NxATerm.app\`.

          Os instaladores não são assinados digitalmente; o Windows pode mostrar um aviso de editor desconhecido. Confira os arquivos com \`SHA256SUMS\`.
          NOTAS
          sed -i 's/^          //' notas.md
          gh release create "$TAG" versao/* --target "$GITHUB_SHA" --title "NxATerm $VERSION" --notes-file notas.md
