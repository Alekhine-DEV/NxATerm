name: Build NxATerm (macOS)

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ci-builds]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest   # Apple Silicon
            label: arm64
          - runner: macos-15-intel # Intel
            label: x86_64
    runs-on: ${{ matrix.runner }}
    # um problema aqui não impede a publicação do Windows e do Linux
    continue-on-error: true
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - uses: ./.github/actions/preparar

      - name: Testes
        working-directory: app/nxaterm
        run: go test ./internal/...

      - name: Ícones
        working-directory: app/nxaterm/build
        run: |
          wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico
          ls -l darwin

      - name: Nome, identificador e versão do app
        working-directory: app/nxaterm
        run: |
          VERSION="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")"
          P=build/darwin/Info.plist
          sed -i.bak \
            -e 's|My Product|NxATerm|g' \
            -e 's|com\.example\.nxaterm|io.github.alekhine-dev.nxaterm|g' \
            -e "s|<string>0\.1\.0</string>|<string>$VERSION</string>|g" \
            -e 's|This is a comment|NxATerm|g' \
            -e 's|© 2026, My Company|© 2026 Alexandre Garcia|g' \
            "$P"
          rm -f "$P.bak"
          grep -A1 -E "CFBundle(Name|Identifier|Version|ShortVersionString)|NSHumanReadableCopyright" "$P"

      - name: Compilar e montar o .app
        working-directory: app/nxaterm
        run: |
          wails3 package
          ls -l bin

      - name: Zip do aplicativo
        working-directory: app/nxaterm
        run: |
          VERSION="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")"
          mkdir -p dist
          mv bin/nxaterm.app bin/NxATerm.app
          APP=bin/NxATerm.app
          echo "app: $APP"
          # assinatura "ad hoc" (sem certificado): o macOS em Apple Silicon exige ao menos isso
          codesign --force --deep -s - "$APP" && codesign -dv "$APP" 2>&1 | head -5 || true
          lipo -info "$APP"/Contents/MacOS/* || true
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/NxATerm-$VERSION-macos-${{ matrix.label }}.zip"
          (cd dist && shasum -a 256 * )

      - name: Publicar
        uses: actions/upload-artifact@v4
        with:
          name: nxaterm-macos-${{ matrix.label }}
          path: app/nxaterm/dist/*.zip
          if-no-files-found: error
