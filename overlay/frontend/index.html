<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NxATerm</title>
  </head>
  <body>
    <div id="app">
      <div id="menubar"></div>
      <div id="toolbar"></div>

      <div id="workspace">
        <div id="quickwrap">
          <input id="quick" type="text" placeholder="Buscar ou conectar" spellcheck="false" autocomplete="off" />
        </div>
        <div id="tabbar"></div>

        <div id="sidewrap">
          <nav id="sidetabs"></nav>
          <aside id="sidebar">
            <section id="panel-sessions" class="panel">
              <div id="tree"></div>
            </section>

            <section id="panel-sftp" class="panel hidden"></section>

            <section id="panel-macros" class="panel hidden">
              <div id="macro-list"></div>
              <button id="btn-macro-new" class="wide">+ Nova macro</button>
            </section>
          </aside>
          <div id="resizer" title="Arraste para redimensionar"></div>
        </div>

        <div id="center">
          <div id="multiexec" class="hidden"></div>
          <div id="stage">
            <div id="home" class="pane"></div>
          </div>
        </div>
      </div>

      <div id="statusbar"></div>
    </div>
    <div id="overlay" class="hidden"></div>
    <div id="toast" class="hidden"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
